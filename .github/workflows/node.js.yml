# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: SkyNest Hotels CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Setup PNPM
      uses: pnpm/action-setup@v2
      with:
        version: 8
        run_install: false
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    # Backend deployment
    - name: Install backend dependencies
      working-directory: ./backend
      run: pnpm install
      
    - name: Setup backend environment
      working-directory: ./backend
      run: |
        mkdir -p config
        echo "${{ secrets.PROD_ENV_FILE }}" > config/.env.production
        echo "${{ secrets.PROD_ENV_FILE }}" > config/.env.test
      
    - name: Build backend
      working-directory: ./backend
      run: pnpm build
      
    - name: Run database migrations
      working-directory: ./backend
      run: pnpm migrate:prod
      
    # Frontend deployment
    - name: Setup frontend environment
      working-directory: ./frontend
      run: |
        echo "${{ secrets.FRONT_ENV_FILE }}" > .env
      
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: pnpm install
      
    - name: Build frontend
      working-directory: ./frontend
      run: pnpm build
      
    # Deployment steps
    - name: Restart backend service
      run: |
        pm2 reload backend || pm2 start ./backend/dist/index.js --name backend
        
    - name: Deploy frontend to Nginx
      run: |
        # Backup existing deployment
        if [ -d "/var/www/skynest-hotels" ]; then
          sudo mkdir -p /var/www/backups
          sudo cp -r /var/www/skynest-hotels /var/www/backups/skynest-hotels-$(date +%Y%m%d%H%M%S)
        fi
        
        # Ensure directory exists with sudo
        sudo mkdir -p /var/www/skynest-hotels
        
        # Copy new build to Nginx serve directory
        sudo cp -r ./frontend/build/* /var/www/skynest-hotels/
        
        # Set proper permissions
        sudo chown -R www-data:www-data /var/www/skynest-hotels
        sudo chmod -R 755 /var/www/skynest-hotels
        
    - name: Reload Nginx
      run: |
        sudo systemctl reload nginx || sudo systemctl restart nginx
