# SkyNest Hotels CI/CD
# Builds backend + frontend and deploys both automatically on push to main

name: SkyNest Hotels CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Setup PNPM
      uses: pnpm/action-setup@v2
      with:
        version: 8
        run_install: false
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    # =========================
    # Backend Deployment
    # =========================
    - name: Install backend dependencies
      working-directory: ./backend
      run: pnpm install
      
    - name: Setup backend environment
      working-directory: ./backend
      run: |
        mkdir -p config
        echo "${{ secrets.PROD_ENV_FILE }}" > config/.env.production
        echo "${{ secrets.PROD_ENV_FILE }}" > config/.env.test
      
    - name: Build backend
      working-directory: ./backend
      run: pnpm build
      
    - name: Run database migrations
      working-directory: ./backend
      run: pnpm migrate:prod
      
    # =========================
    # Frontend Deployment
    # =========================
    - name: Setup frontend environment
      working-directory: ./frontend
      run: |
        echo "${{ secrets.FRONT_ENV_FILE }}" > .env
      
    - name: Install frontend dependencies
      working-directory: ./frontend
      run: pnpm install
      
    - name: Build frontend
      working-directory: ./frontend
      run: pnpm build
      
    # =========================
    # Deploy to Server
    # =========================
    - name: Restart backend service
      run: |
        cd /home/ubuntu/Applications/actions-runner/_work/SkyNest_Hotels/SkyNest_Hotels
        if pm2 list | grep -q "backend"; then
          echo "Reloading existing backend process..."
          pm2 reload backend --update-env
        else
          echo "Starting new backend process..."
          pm2 start ./backend/dist/index.js --name backend --update-env
        fi
        pm2 save
      
    - name: Deploy frontend to Nginx
      run: |
        echo "Deploying frontend build to /var/www/html..."
        sudo rm -rf /var/www/html/*
        sudo cp -r /home/ubuntu/Applications/actions-runner/_work/SkyNest_Hotels/SkyNest_Hotels/frontend/build/* /var/www/html/
        
    - name: Reload Nginx
      run: |
        echo "Reloading Nginx..."
        sudo systemctl reload nginx || sudo systemctl restart nginx
